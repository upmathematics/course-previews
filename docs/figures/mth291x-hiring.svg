<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" class="g1" role="img" aria-labelledby="g1-title g1-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="g1-title">Same résumé, different score</title>
<desc id="g1-desc">A simulated hiring algorithm scores two identical résumés. Both start at 74, but the applicant from the South neighborhood loses 14 points, falls to 60, and misses the interview cutoff of 65. The model never sees anyone's group; it learned from past hiring, where neighborhood stood in for group.</desc>
<style>.g1 { --bg: var(--fig-bg, #ffffff); --ink: var(--fig-ink, #000000); --muted: var(--fig-muted, #666666); --line: var(--fig-line, #cccccc); --violet: var(--fig-violet, #d6336c); --gold: var(--fig-gold, #20a39e); --teal: var(--fig-teal, #339933); --rust: var(--fig-rust, #cc3333); }
@media (prefers-color-scheme: dark) { .g1 { --bg: var(--fig-bg, #191726); --ink: var(--fig-ink, #ecebf5); --muted: var(--fig-muted, #a9a5c2); --line: var(--fig-line, #3d3958); --violet: var(--fig-violet, #a08cff); --gold: var(--fig-gold, #f0b443); --teal: var(--fig-teal, #3cc7bf); --rust: var(--fig-rust, #f08a6f); } }

.g1 text { font-family: var(--fig-mono, 'Courier New', Courier, monospace); fill: var(--ink); }
.g1 .g1-muted { fill: var(--muted); }
.g1 .g1-bg { fill: var(--bg); }

.g1 .g1-card { fill: var(--bg); stroke: var(--line); stroke-width: 1.4; }
.g1 .g1-hl { fill: var(--gold); fill-opacity: .22; }
.g1 .g1-track { fill: var(--line); fill-opacity: .45; }
.g1 .g1-barA { fill: var(--violet); }
.g1 .g1-barB { fill: var(--gold); }
.g1 .g1-penbar { fill: var(--rust); fill-opacity: .25; stroke: var(--rust); stroke-width: 1.2; stroke-dasharray: 3 2; }
.g1 .g1-cut { stroke: var(--ink); stroke-width: 1.6; stroke-dasharray: 4 3; }
.g1 .g1-rust { fill: var(--rust); }
@keyframes g1-act2 { 0% { opacity: 0; } 3%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
.g1 .g1-act2 { animation: g1-act2 14s linear infinite; }
@keyframes g1-grow { 0%, 8% { transform: scaleX(0); } 22%, 100% { transform: scaleX(1); } }
.g1 .g1-grow { transform-box: fill-box; transform-origin: 0 50%; animation: g1-grow 14s ease-out infinite; }
@keyframes g1-bfull { 0%, 7.00% { opacity: 0; } 8.00%, 38.00% { opacity: 1; } 39.00%, 100% { opacity: 0; } }
.g1 .g1-bfull { opacity: 0; animation: g1-bfull 14s linear infinite; }
.g1 .g1-grow.g1-bfull { animation: g1-grow 14s ease-out infinite, g1-bfull 14s linear infinite; }
@keyframes g1-bfinal { 0%, 37.50% { opacity: 0; } 38.50%, 100% { opacity: 1; } }
.g1 .g1-bfinal {  animation: g1-bfinal 14s linear infinite; }
@keyframes g1-pen { 0%, 37.00% { opacity: 0; } 38.00%, 100% { opacity: 1; } }
.g1 .g1-pen {  animation: g1-pen 14s linear infinite; }
@keyframes g1-s74 { 0%, 21.00% { opacity: 0; } 22.00%, 100% { opacity: 1; } }
.g1 .g1-s74 {  animation: g1-s74 14s linear infinite; }
@keyframes g1-b74 { 0%, 21.00% { opacity: 0; } 22.00%, 38.00% { opacity: 1; } 39.00%, 100% { opacity: 0; } }
.g1 .g1-b74 { opacity: 0; animation: g1-b74 14s linear infinite; }
@keyframes g1-b60 { 0%, 37.50% { opacity: 0; } 38.50%, 100% { opacity: 1; } }
.g1 .g1-b60 {  animation: g1-b60 14s linear infinite; }
@keyframes g1-out { 0%, 51.00% { opacity: 0; } 52.00%, 100% { opacity: 1; } }
.g1 .g1-out {  animation: g1-out 14s linear infinite; }
@keyframes g1-note { 0%, 63.00% { opacity: 0; } 64.00%, 100% { opacity: 1; } }
.g1 .g1-note {  animation: g1-note 14s linear infinite; }

@media (prefers-reduced-motion: reduce) {
  .g1 * { animation: none !important; }
  .g1 .g1-act2 { opacity: 1; }
  .g1 .g1-bfull, .g1 .g1-b74 { opacity: 0; }
}
</style>
<rect class="g1-bg" width="360" height="440"/>
<g class="g1-act2" opacity="1">
<text x="24" y="30" font-size="13.5" font-weight="600">Same résumé, different score</text>
<text x="24" y="48" font-size="11.5" class="g1-muted">a hiring algorithm trained on past decisions</text>
<rect class="g1-card" x="24" y="62" width="148" height="132" rx="6"/><rect class="g1-barA" x="24" y="62" width="148" height="5" rx="2"/><text x="36" y="88" font-size="12.5" font-weight="600">Applicant 1</text><text x="36" y="110" font-size="11" class="g1-muted">Degree</text><text x="160" y="110" font-size="11" text-anchor="end">B.S.</text><text x="36" y="128" font-size="11" class="g1-muted">Experience</text><text x="160" y="128" font-size="11" text-anchor="end">4 years</text><text x="36" y="146" font-size="11" class="g1-muted">Skills test</text><text x="160" y="146" font-size="11" text-anchor="end">82/100</text><rect class="g1-hl" x="30" y="163" width="136" height="22" rx="4"/><text x="36" y="178" font-size="11" class="g1-muted">Neighborhood</text><text x="160" y="178" font-size="11" text-anchor="end" font-weight="600">North</text>
<rect class="g1-card" x="188" y="62" width="148" height="132" rx="6"/><rect class="g1-barB" x="188" y="62" width="148" height="5" rx="2"/><text x="200" y="88" font-size="12.5" font-weight="600">Applicant 2</text><text x="200" y="110" font-size="11" class="g1-muted">Degree</text><text x="324" y="110" font-size="11" text-anchor="end">B.S.</text><text x="200" y="128" font-size="11" class="g1-muted">Experience</text><text x="324" y="128" font-size="11" text-anchor="end">4 years</text><text x="200" y="146" font-size="11" class="g1-muted">Skills test</text><text x="324" y="146" font-size="11" text-anchor="end">82/100</text><rect class="g1-hl" x="194" y="163" width="136" height="22" rx="4"/><text x="200" y="178" font-size="11" class="g1-muted">Neighborhood</text><text x="324" y="178" font-size="11" text-anchor="end" font-weight="600">South</text>
<text x="24" y="224" font-size="12.5" font-weight="600">Algorithm's score (0 to 100)</text>
<text x="24" y="246" font-size="11" class="g1-muted">Applicant 1</text>
<text class="g1-s74" x="336" y="246" font-size="11.5" font-weight="600" text-anchor="end">74</text>
<rect class="g1-track" x="24" y="252" width="312" height="16" rx="3"/>
<rect class="g1-barA g1-grow" x="24" y="252" width="230.9" height="16" rx="3"/>
<text x="24" y="290" font-size="11" class="g1-muted">Applicant 2</text>
<text class="g1-b74" x="336" y="290" font-size="11.5" font-weight="600" text-anchor="end">74</text>
<text class="g1-b60" x="336" y="290" font-size="11.5" font-weight="600" text-anchor="end">60</text>
<text class="g1-pen g1-rust" x="308" y="290" font-size="11" text-anchor="end">−14 for neighborhood</text>
<rect class="g1-track" x="24" y="296" width="312" height="16" rx="3"/>
<rect class="g1-barB g1-grow g1-bfull" x="24" y="296" width="230.9" height="16" rx="3"/>
<rect class="g1-barB g1-bfinal" x="24" y="296" width="187.2" height="16" rx="3"/>
<rect class="g1-penbar g1-pen" x="211.2" y="296" width="43.7" height="16"/>
<line class="g1-cut" x1="226.8" x2="226.8" y1="248" y2="272"/>
<line class="g1-cut" x1="226.8" x2="226.8" y1="293" y2="318"/>
<text x="226.8" y="334" font-size="10.5" text-anchor="middle" class="g1-muted">interview cutoff: 65</text>
<g class="g1-out"><text x="24" y="352" font-size="12">Applicant 1 → <tspan font-weight="600">interview</tspan></text><text x="24" y="369" font-size="12">Applicant 2 → <tspan font-weight="600" class="g1-rust">no interview</tspan></text></g>
<g class="g1-note"><text x="24" y="390" font-size="11" class="g1-muted">The model never sees anyone's group.</text><text x="24" y="404" font-size="11" class="g1-muted">It learned from past hiring decisions,</text><text x="24" y="418" font-size="11" class="g1-muted">where neighborhood stood in for group.</text></g>
</g>
<text x="336" y="434" font-size="9.5" text-anchor="end" class="g1-muted">simulated data</text>
</svg>